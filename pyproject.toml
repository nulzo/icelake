[project]
name = "icelake"
version = "0.2.0"
description = "Accurate, scalable, cost-effective agentic memory layer for Discord bots."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nolan Gregory", email = "nolanpgregory@gmail.com" }]
keywords = ["discord", "memory", "agents", "llm", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.10", "dnspython>=2.6"]
local-embeddings = ["sentence-transformers>=3.0"]
discord = ["discord.py>=2.4"]

[project.urls]
Homepage = "https://github.com/nulzo/icelake"
Documentation = "https://github.com/nulzo/icelake/tree/main/docs"
Source = "https://github.com/nulzo/icelake"
Issues = "https://github.com/nulzo/icelake/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "discord-py>=2.4",
    "pymongo>=4.10",
    "pyyaml>=6.0",
    "towncrier>=24.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
exclude = []
packages = ["src/icelake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["src/icelake"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108"]  # ternaries are not always clearer

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
title_format = "## [{version}](https://github.com/nulzo/icelake/tree/v{version}) - {project_date}"
issue_format = "[#{issue}](https://github.com/nulzo/icelake/issues/{issue})"

[[tool.towncrier.type]]
name = "Security"

[[tool.towncrier.type]]
name = "Removed"

[[tool.towncrier.type]]
name = "Deprecated"

[[tool.towncrier.type]]
name = "Added"

[[tool.towncrier.type]]
name = "Changed"

[[tool.towncrier.type]]
name = "Fixed"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["icelake"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["sentence_transformers.*"]
ignore_missing_imports = true
