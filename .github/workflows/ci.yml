name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=icelake_test&directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev
      - name: Start disposable replica set
        run: docker run --detach --name icelake-mongo -p 27017:27017 mongo:7 --replSet icelake_test --bind_ip_all
      - name: Wait for MongoDB
        run: |
          for i in $(seq 1 30); do
            uv run python -c "import socket; socket.create_connection(('127.0.0.1', 27017), 1).close()" && exit 0
            sleep 1
          done
          echo "MongoDB did not become ready" >&2
          exit 1
      - name: Initialize transactions
        run: |
          uv run python - <<'PY'
          import time
          from pymongo import MongoClient
          client = MongoClient('mongodb://127.0.0.1:27017/?directConnection=true')
          client.admin.command('replSetInitiate', {
              '_id': 'icelake_test',
              'members': [{'_id': 0, 'host': 'localhost:27017'}],
          })
          for _ in range(60):
              if client.admin.command('hello').get('isWritablePrimary'):
                  break
              time.sleep(1)
          else:
              raise RuntimeError('replica set did not elect a primary')
          client.close()
          PY
      - run: uv run pytest tests/ -q --live-mongo --cov=icelake --cov-report=xml
      - uses: codecov/codecov-action@v5
        if: matrix.python-version == '3.12'
        with:
          files: coverage.xml
          fail_ci_if_error: false

  changelog:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run towncrier check --compare-with origin/${{ github.base_ref }}
