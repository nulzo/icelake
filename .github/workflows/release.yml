name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Base bump. 'none' releases the version already in pyproject.toml (e.g. a manual major)."
        required: true
        type: choice
        options: [minor, patch, none]
      prerelease:
        description: "Pre-release stage (PEP 440). Pre-releases may run on any branch and push only a tag."
        required: true
        type: choice
        options: [none, alpha, beta, rc]

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev

      - name: Guard stable releases to main
        if: inputs.prerelease == 'none'
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Stable releases must run on main. Use a prerelease stage from a feature branch." >&2
            exit 1
          fi

      - name: Compute version
        id: bump
        run: |
          set -euo pipefail
          if [ "${{ inputs.bump }}" = "none" ]; then
            BASE="$(uv version --short)"
          else
            BASE="$(uv version --bump "${{ inputs.bump }}" --dry-run | awk '{print $NF}')"
          fi
          if [ "${{ inputs.prerelease }}" = "none" ]; then
            VERSION="$BASE"
          else
            case "${{ inputs.prerelease }}" in
              alpha) SHORT=a ;; beta) SHORT=b ;; rc) SHORT=rc ;;
            esac
            LAST=0
            for TAG in $(git tag -l "v${BASE}${SHORT}[0-9]*"); do
              N="${TAG#v${BASE}${SHORT}}"
              [ "$N" -gt "$LAST" ] && LAST="$N"
            done
            VERSION="${BASE}${SHORT}$((LAST + 1))"
          fi
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "Tag v${VERSION} already exists." >&2
            exit 1
          fi
          uv version "$VERSION" --no-sync
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build changelog
        run: uv run towncrier build --yes --version "${{ steps.bump.outputs.version }}"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock CHANGELOG.md changelog.d
          git commit -m "release: v${{ steps.bump.outputs.version }}"
          git tag -a "v${{ steps.bump.outputs.version }}" -m "v${{ steps.bump.outputs.version }}"

      - name: Push stable release to main
        if: inputs.prerelease == 'none'
        run: git push origin HEAD:main

      - name: Push tag
        run: git push origin "v${{ steps.bump.outputs.version }}"

      - name: Trigger PyPI publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GITHUB_TOKEN tag pushes do not start other workflows; dispatch explicitly.
          # Retry briefly in case the tag is not yet visible as a dispatch ref.
          for i in 1 2 3 4 5; do
            gh workflow run publish.yml --ref "v${{ steps.bump.outputs.version }}" && exit 0
            sleep 2
          done
          echo "Failed to dispatch publish.yml for v${{ steps.bump.outputs.version }}" >&2
          exit 1
