name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Base version bump"
        required: true
        type: choice
        options: [patch, minor, major]
      prerelease:
        description: "Pre-release stage (PEP 440)"
        required: false
        type: choice
        options: [none, alpha, beta, rc]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev

      - name: Bump version
        id: bump
        run: |
          if [ "${{ inputs.prerelease }}" = "none" ]; then
            uv version --bump "${{ inputs.bump }}" --frozen --no-sync
          else
            uv version --bump "${{ inputs.bump }}" --bump "${{ inputs.prerelease }}" --frozen --no-sync
          fi
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Build changelog
        run: uv run towncrier build --yes --version "${{ steps.bump.outputs.version }}"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml CHANGELOG.md changelog.d
          git commit -m "release: v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"

      - name: Push
        run: git push origin HEAD:main --follow-tags
