name: mention_extraction
llm_operations:
  - subject_token: p1
    speaker_token: p0
    text: "bob is learning to play guitar"
    category: interests
    confidence: 0.85
    source_message_indexes: [1]
messages:
  - author_id: alice_id
    display_name: alice
    content: "@bob how is the guitar practice going"
    mentions: ["bob_id"]
expected_facts:
  - subject_id: bob_id
    text_contains: "guitar"
forbidden_facts:
  - text_contains: "alice is learning"
